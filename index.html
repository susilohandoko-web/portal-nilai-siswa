<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Hasil Ujian Siswa (Multi-Sekolah)</title>
    <!-- Font, Icons, SheetJS & Supabase SDK -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0e7ff 100%);
            color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container {
            width: 100%; max-width: 680px; background: #ffffff; border-radius: 24px; padding: 40px;
            box-shadow: 0 20px 50px rgba(14, 165, 233, 0.12); border: 1px solid rgba(224, 242, 254, 0.8); position: relative;
        }
        .admin-btn {
            position: absolute; top: 20px; right: 20px; background: #f0f9ff; border: 1px solid #bae6fd;
            color: #0284c7; padding: 10px 18px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 8px; transition: all 0.2s ease; z-index: 10;
        }
        .admin-btn:hover { background: #0284c7; color: #ffffff; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }
        .header { text-align: center; margin-bottom: 32px; margin-top: 10px; }
        .school-title { font-size: 24px; font-weight: 800; color: #0f172a; }
        .portal-title { font-size: 16px; font-weight: 600; color: #0284c7; margin-top: 4px; }
        .search-box { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 14px 18px; border-radius: 14px; border: 1.5px solid #cbd5e1;
            background: #f8fafc; font-size: 15px; outline: none; transition: all 0.2s;
        }
        input:focus { border-color: #0284c7; background: #fff; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15); }
        .btn-primary {
            padding: 14px; border-radius: 14px; border: none; background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s;
        }
        .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
        .error-msg { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 14px; border-radius: 12px; display: none; text-align: center; margin-bottom: 20px; font-size: 14px; }
        .result-card { display: none; }
        .student-info { background: #f0f9ff; padding: 18px; border-radius: 16px; margin-bottom: 20px; border-left: 5px solid #0284c7; }
        .student-info div { margin-bottom: 4px; }
        .scores-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .score-item { background: #f8fafc; padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; border: 1px solid #e2e8f0; font-size: 14px; }

        /* Style Modal Window */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-content { background: #fff; border-radius: 20px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-header h3 { font-size: 18px; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .close-btn { background: #f1f5f9; border: none; font-size: 20px; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: #64748b; }
        .form-group { margin-bottom: 16px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #334155; display: block; margin-bottom: 6px; }

        @media(max-width: 480px) {
            .scores-grid { grid-template-columns: 1fr; }
            .container { padding: 25px 20px; }
            .admin-btn { position: relative; top: 0; right: 0; width: 100%; justify-content: center; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <button class="admin-btn" type="button" onclick="openAuthModal()"><i class="fa-solid fa-lock"></i> Panel Guru</button>

    <div class="header">
        <i class="fa-solid fa-school" style="font-size: 48px; color: #0284c7; margin-bottom: 10px;"></i>
        <h1 class="school-title">Portal Ujian Online</h1>
        <h2 class="portal-title">Pencarian Hasil Ujian Siswa</h2>
        <p style="font-size: 13px; color: #64748b; margin-top: 6px;">Masukkan Kode Sekolah & NISN untuk melihat nilai</p>
    </div>

    <div class="search-box">
        <input type="text" id="schoolCodeInput" placeholder="Masukkan Kode Sekolah (contoh: SDN05)">
        <input type="text" id="nisnInput" placeholder="Masukkan NISN Siswa (contoh: 0123456789)" onkeypress="if(event.key==='Enter') cariNilaiOnline()">
        <button class="btn-primary" type="button" onclick="cariNilaiOnline()"><i class="fa-solid fa-magnifying-glass"></i> Cari Nilai</button>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <div id="resultCard" class="result-card">
        <div class="student-info">
            <div><strong>SEKOLAH:</strong> <span id="resSekolah"></span></div>
            <div><strong>NAMA SISWA:</strong> <span id="resNama" style="font-weight:700;"></span></div>
            <div><strong>NISN:</strong> <span id="resNisn"></span></div>
        </div>
        <div class="scores-grid" id="scoresGrid"></div>
    </div>
</div>

<!-- Modal Auth / Login Guru -->
<div class="modal" id="authModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-shield-halved" style="color:#0284c7;"></i> Akses Panel Guru</h3>
            <button class="close-btn" type="button" onclick="closeModal('authModal')">&times;</button>
        </div>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 16px;">Masukkan Kode Sekolah & Password Anda</p>
        <div class="form-group">
            <label>Kode Sekolah</label>
            <input type="text" id="authSchoolCode" placeholder="Contoh: SDN05">
        </div>
        <div class="form-group">
            <label>Password Guru</label>
            <input type="password" id="authPassword" placeholder="Masukkan Password" onkeypress="if(event.key==='Enter') loginGuru()">
        </div>
        <div id="authError" style="color:#dc2626; font-size:13px; margin-bottom:12px; display:none;"></div>
        <button class="btn-primary" type="button" style="width:100%" onclick="loginGuru()">Masuk / Buat Akun</button>
    </div>
</div>

<!-- Modal Panel Pengaturan Guru -->
<div class="modal" id="adminModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-sliders" style="color:#0284c7;"></i> Panel Pengaturan Guru</h3>
            <button class="close-btn" type="button" onclick="closeModal('adminModal')">&times;</button>
        </div>
        <p style="font-size: 13px; color: #0284c7; font-weight:700; margin-bottom:15px;" id="activeSchoolInfo"></p>

        <div class="form-group">
            <label>Upload File Excel Data Nilai (.xlsx / .xls)</label>
            <input type="file" id="inputExcelFile" accept=".xlsx, .xls" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:10px;">
        </div>
        <button class="btn-primary" type="button" style="width:100%" onclick="uploadExcelToCloud()">Upload & Sync ke Cloud</button>
    </div>
</div>

<script>
    // === KONFIGURASI SUPABASE ===
    // Pastikan ganti nilai di bawah ini dengan kredensial Supabase milik Anda!
    const SUPABASE_URL = "https://amuvpxnhiqwzcggnbuau.supabase.co";
    const SUPABASE_KEY = "sb_publishable_NyoX8xKg-nAztYPeVBbihg_GxMEadgv";

    let db = null;
    let activeSchool = "";

    // Inisialisasi Supabase secara aman
    try {
        if (typeof supabase !== 'undefined' && SUPABASE_URL !== "https://YOUR_SUPABASE_URL.supabase.co") {
            db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
    } catch (e) {
        console.warn("Supabase belum dikonfigurasi dengan benar.");
    }

    // Modal Control Functions
    function openAuthModal() {
        document.getElementById('authError').style.display = 'none';
        document.getElementById('authModal').style.display = 'flex';
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    // Login Guru
    async function loginGuru() {
        const code = document.getElementById('authSchoolCode').value.trim().toUpperCase();
        const pass = document.getElementById('authPassword').value.trim();
        const err = document.getElementById('authError');

        if (!code || !pass) { 
            err.innerText = "Harap isi Kode Sekolah dan Password!"; 
            err.style.display = 'block'; 
            return; 
        }

        if (!db) {
            err.innerText = "Supabase belum dihubungkan! Harap masukkan SUPABASE_URL & SUPABASE_KEY terlebih dahulu di kode HTML.";
            err.style.display = 'block';
            return;
        }

        try {
            let { data: school, error } = await db.from('sekolah').select('*').eq('kode_sekolah', code).maybeSingle();

            if (error) throw error;

            if (!school) {
                // Registrasi sekolah baru
                const { error: insertErr } = await db.from('sekolah').insert([{ kode_sekolah: code, password: pass }]);
                if (insertErr) throw insertErr;
                activeSchool = code;
                openAdminPanel();
            } else if (school.password === pass) {
                activeSchool = code;
                openAdminPanel();
            } else {
                err.innerText = "Password Salah!";
                err.style.display = 'block';
            }
        } catch (e) {
            err.innerText = "Gagal terhubung ke database: " + e.message;
            err.style.display = 'block';
        }
    }

    function openAdminPanel() {
        closeModal('authModal');
        document.getElementById('activeSchoolInfo').innerText = "Sekolah Terhubung: " + activeSchool;
        document.getElementById('adminModal').style.display = 'flex';
    }

    // Sync Excel ke Supabase
    async function uploadExcelToCloud() {
        const fileInput = document.getElementById('inputExcelFile');
        const file = fileInput.files[0];

        if (!file) { alert("Pilih file Excel terlebih dahulu!"); return; }
        if (!db) { alert("Supabase belum dikonfigurasi!"); return; }

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

                if (jsonData.length === 0) {
                    alert("File Excel kosong!");
                    return;
                }

                // Hapus data lama sekolah ini
                await db.from('nilai_siswa').delete().eq('kode_sekolah', activeSchool);

                // Format data baru
                const rows = jsonData.map(row => {
                    const nisn = String(row['NISN'] || row['nisn'] || '').trim();
                    const nama = row['NAMA SISWA'] || row['nama'] || row['Nama'] || '-';
                    
                    let copyRow = { ...row };
                    delete copyRow['NISN']; 
                    delete copyRow['nisn'];
                    delete copyRow['NAMA SISWA'];
                    delete copyRow['nama'];

                    return {
                        kode_sekolah: activeSchool,
                        nisn: nisn,
                        nama_siswa: nama,
                        nilai: copyRow
                    };
                });

                const { error } = await db.from('nilai_siswa').insert(rows);
                if (!error) {
                    alert("Berhasil! " + rows.length + " data nilai berhasil tersimpan ke Cloud.");
                    fileInput.value = '';
                    closeModal('adminModal');
                } else {
                    throw error;
                }
            } catch (err) {
                alert("Gagal mengunggah data: " + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    }

    // Function Cari Nilai Siswa
    async function cariNilaiOnline() {
        const schoolCode = document.getElementById('schoolCodeInput').value.trim().toUpperCase();
        const nisn = document.getElementById('nisnInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');

        if (!schoolCode || !nisn) {
            errorMsg.innerText = "Harap isi Kode Sekolah dan NISN!";
            errorMsg.style.display = 'block';
            return;
        }

        if (!db) {
            errorMsg.innerText = "Database belum terhubung. Konfigurasikan Supabase URL & Key pada kode HTML!";
            errorMsg.style.display = 'block';
            return;
        }

        try {
            const { data, error } = await db
                .from('nilai_siswa')
                .select('*')
                .eq('kode_sekolah', schoolCode)
                .eq('nisn', nisn)
                .maybeSingle();

            if (error || !data) {
                errorMsg.innerText = "Data tidak ditemukan. Periksa kembali Kode Sekolah & NISN Anda!";
                errorMsg.style.display = 'block';
                resultCard.style.display = 'none';
            } else {
                errorMsg.style.display = 'none';
                document.getElementById('resSekolah').innerText = data.kode_sekolah;
                document.getElementById('resNama').innerText = data.nama_siswa;
                document.getElementById('resNisn').innerText = data.nisn;

                const scoresGrid = document.getElementById('scoresGrid');
                scoresGrid.innerHTML = '';
                
                const scores = typeof data.nilai === 'string' ? JSON.parse(data.nilai) : data.nilai;
                Object.keys(scores).forEach(mapel => {
                    const item = document.createElement('div');
                    item.className = 'score-item';
                    item.innerHTML = `<span>${mapel}</span><strong>${scores[mapel] !== undefined ? scores[mapel] : '-'}</strong>`;
                    scoresGrid.appendChild(item);
                });

                resultCard.style.display = 'block';
            }
        } catch (e) {
            errorMsg.innerText = "Terjadi kesalahan saat mengambil data: " + e.message;
            errorMsg.style.display = 'block';
        }
    }
</script>

</body>
</html>
